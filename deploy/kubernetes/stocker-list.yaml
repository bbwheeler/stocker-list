apiVersion: v1
kind: Namespace
metadata:
  name: stocker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stocker-list-config
  namespace: stocker
  labels:
    app: stocker-list
data:
  RABBITMQ_EXCHANGE: stocker
  RABBITMQ_EXCHANGE_TYPE: topic
  RABBITMQ_ROUTING_KEY: stock.update.v1.list
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stocker-list
  namespace: stocker
  labels:
    app: stocker-list
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: stocker-list
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: stocker-list
        spec:
          restartPolicy: Never
          containers:
            - name: stocker-list
              image: git.wheeli.ca/brian/stocker-list:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: stocker-list-config
                - secretRef:
                    name: stocker-list-env
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1024Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
                runAsUser: 65532
                runAsGroup: 65532
